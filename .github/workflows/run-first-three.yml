name: Run first three demos

# Runs the demo suite on every architecture the project targets:
#   - x86_64 : ubuntu-latest        (hosted; native x86_64 guest build)
#   - arm64  : ubuntu-24.04-arm     (hosted; x86_64 cross compiler from apt)
#   - riscv64: self-hosted runner   (amd64 sysroot driven through qemu-user)
# GitHub has no hosted riscv64 runner, so that leg needs a self-hosted runner
# (labels: self-hosted, linux, riscv64) registered on a RISC-V box.
#
# Manual-only, like main's copy. The "Run workflow" button is registered from
# the workflow of the same path on the default branch; when you trigger it you
# can pick any branch as the ref, and GitHub runs THAT branch's copy of this
# file. So this version can test a feature branch without touching main.
on:
  workflow_dispatch:

jobs:
  demos:
    name: demos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t passthrough-image .

      - name: Run 1-simple, 2-callback, 3-minizip
        id: run
        run: |
          set -o pipefail
          docker run --rm passthrough-image bash run-first-three.sh 2>&1 | tee run.log

      - name: Publish summary
        if: always()
        run: |
          clean="$(sed -r 's/\x1b\[[0-9;]*m//g' run.log)"
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            status="✅ All three demos passed on ${{ matrix.arch }}"
          else
            status="❌ Demos failed on ${{ matrix.arch }} — see the log below"
          fi
          {
            echo "## QEMU pass-through — first three demos (${{ matrix.arch }})"
            echo
            echo "$status"
            echo
            echo "### Result"
            echo '```text'
            echo "$clean" | sed -n '/:: Summary/,$p'
            echo '```'
            echo
            echo "<details><summary>Full build &amp; run log</summary>"
            echo
            echo '```text'
            echo "$clean"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # riscv64 runs on a self-hosted runner. It deliberately avoids JS actions
  # (actions/checkout needs Node, and there is no Node 20 for riscv64): the
  # checkout is a plain `git clone`, which also goes through the runner's proxy.
  # The runner must be started with the proxy in its environment (e.g.
  # `source ~/setup-proxy.sh && ./run.sh`) so git/docker can reach the network.
  demos-riscv64:
    name: demos (riscv64, self-hosted)
    runs-on: [self-hosted, linux, riscv64]
    timeout-minutes: 120

    steps:
      - name: Checkout (shell clone — no Node needed on riscv64)
        run: |
          rm -rf repo
          git clone --depth 1 -b "${{ github.ref_name }}" \
            "${{ github.server_url }}/${{ github.repository }}.git" repo

      - name: Build Docker image (forward proxy to the build)
        working-directory: repo
        run: |
          docker build \
            --build-arg http_proxy="$http_proxy"   --build-arg https_proxy="$https_proxy" \
            --build-arg HTTP_PROXY="$http_proxy"    --build-arg HTTPS_PROXY="$https_proxy" \
            -f docker/Dockerfile -t passthrough-image .

      - name: Run 1-simple, 2-callback, 3-minizip
        id: run
        working-directory: repo
        run: |
          set -o pipefail
          docker run --rm passthrough-image bash run-first-three.sh 2>&1 | tee "$GITHUB_WORKSPACE/run.log"

      - name: Publish summary
        if: always()
        run: |
          clean="$(sed -r 's/\x1b\[[0-9;]*m//g' run.log)"
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            status="✅ All three demos passed on riscv64"
          else
            status="❌ Demos failed on riscv64 — see the log below"
          fi
          {
            echo "## QEMU pass-through — first three demos (riscv64)"
            echo
            echo "$status"
            echo
            echo "### Result"
            echo '```text'
            echo "$clean" | sed -n '/:: Summary/,$p'
            echo '```'
            echo
            echo "<details><summary>Full build &amp; run log</summary>"
            echo
            echo '```text'
            echo "$clean"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
